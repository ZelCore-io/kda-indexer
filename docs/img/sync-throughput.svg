<svg xmlns="http://www.w3.org/2000/svg" width="880" height="364" viewBox="0 0 880 364" role="img" aria-labelledby="sync-throughput-t sync-throughput-d">
<title id="sync-throughput-t">Full backfill throughput by height range</title>
<desc id="sync-throughput-d">heights 0–0.85M: kda-indexer 5,768 blocks/s, chainweb-data not measured; heights 0.85–2.0M: kda-indexer 6,208 blocks/s, chainweb-data not measured; heights 2.0–3.4M: kda-indexer 5,359 blocks/s, chainweb-data not measured; heights 3.4–3.7M: kda-indexer 4,703 blocks/s, chainweb-data not measured; heights 3.7–5.3M: kda-indexer 3,000 blocks/s, chainweb-data not measured; heights 5.3–7.39M: kda-indexer 4,609 blocks/s, chainweb-data not measured.</desc>
<style>
svg{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.bg{fill:#ffffff}
.title{fill:#1f2328;font-size:16px;font-weight:600}
.sub,.tick,.muted{fill:#59636e;font-size:11px}
.label{fill:#1f2328;font-size:12px}
.val{fill:#1f2328;font-size:11px}
.grid{stroke:#d8dee4;stroke-width:1}
.ours.better{fill:#1a7f37}
.ours.worse{fill:#cf222e}
.ours.same,.ours.none{fill:#57606a}
.base{fill:#afb8c1}
.up{fill:#1a7f37}
.down{fill:#cf222e}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}
.title,.label,.val{fill:#e6edf3}
.sub,.tick,.muted{fill:#9198a1}
.grid{stroke:#30363d}
.ours.better{fill:#3fb950}
.ours.worse{fill:#f85149}
.ours.same,.ours.none{fill:#9198a1}
.base{fill:#484f58}
.up{fill:#3fb950}
.down{fill:#f85149}
}
</style>
<rect class="bg" x="0" y="0" width="880" height="364" rx="6"/>
<text class="title" x="16" y="28">Full backfill throughput by height range</text>
<text class="sub" x="16" y="48">blocks/s · linear scale · ▲ better ▼ worse than the baseline · interim numbers</text>
<rect class="ours none" x="16" y="62" width="10" height="10" rx="2"/>
<text class="muted" x="30" y="71">kda-indexer, no baseline</text>
<g class="axis linear">
<line class="grid" x1="260.0" y1="78" x2="260.0" y2="324"/>
<text class="tick" x="260.0" y="340" text-anchor="middle">0</text>
<line class="grid" x1="340.0" y1="78" x2="340.0" y2="324"/>
<text class="tick" x="340.0" y="340" text-anchor="middle">2,000</text>
<line class="grid" x1="420.0" y1="78" x2="420.0" y2="324"/>
<text class="tick" x="420.0" y="340" text-anchor="middle">4,000</text>
<line class="grid" x1="500.0" y1="78" x2="500.0" y2="324"/>
<text class="tick" x="500.0" y="340" text-anchor="middle">6,000</text>
<line class="grid" x1="580.0" y1="78" x2="580.0" y2="324"/>
<text class="tick" x="580.0" y="340" text-anchor="middle">8,000</text>
</g>
<g class="metric" id="sync-band-0-0.85M-blocks">
<text class="label" x="250" y="100" text-anchor="end">heights 0–0.85M</text>
<rect class="ours none" x="260" y="84" width="230.7" height="12" rx="2"/>
<text class="val" x="496.7" y="94">5,768 blocks/s
</text>
<text class="muted" x="260" y="109">chainweb-data: not measured</text>
</g>
