<svg xmlns="http://www.w3.org/2000/svg" width="880" height="487" viewBox="0 0 880 487" role="img" aria-labelledby="latency-rest-p50-t latency-rest-p50-d">
<title id="latency-rest-p50-t">REST response time, median (p50)</title>
<desc id="latency-rest-p50-d">/txs/account p50: kda-indexer 6 ms, chainweb-data 95 ms, about 16× faster (−94%); /txs/events p50: kda-indexer 4 ms, chainweb-data 38 ms, about 9.5× faster (−89%); /txs/recent p50: kda-indexer 1 ms, chainweb-data 5 ms, about 5× faster (−80%); /txs/search p50: kda-indexer 38 ms, chainweb-data 38 ms, about the same; /stats p50: kda-indexer 1 ms, chainweb-data 11 ms, about 11× faster (−91%); /txs/txs p50: kda-indexer 1 ms, chainweb-data 6 ms, about 6× faster (−83%); /txs/tx p50: kda-indexer 4 ms, chainweb-data 22 ms, about 5.5× faster (−82%); /coins p50: kda-indexer 1 ms, chainweb-data 4 ms, about 4× faster (−75%); /v1/txs p50: kda-indexer 38 ms, /v1/txs service 137 ms, about 3.6× faster (−72%).</desc>
<style>
svg{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.bg{fill:#ffffff}
.title{fill:#1f2328;font-size:16px;font-weight:600}
.sub,.tick,.muted{fill:#59636e;font-size:11px}
.label{fill:#1f2328;font-size:12px}
.val{fill:#1f2328;font-size:11px}
.grid{stroke:#d8dee4;stroke-width:1}
.ours.better{fill:#1a7f37}
.ours.worse{fill:#cf222e}
.ours.same,.ours.none{fill:#57606a}
.base{fill:#afb8c1}
.up{fill:#1a7f37}
.down{fill:#cf222e}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}
.title,.label,.val{fill:#e6edf3}
.sub,.tick,.muted{fill:#9198a1}
.grid{stroke:#30363d}
.ours.better{fill:#3fb950}
.ours.worse{fill:#f85149}
.ours.same,.ours.none{fill:#9198a1}
.base{fill:#484f58}
.up{fill:#3fb950}
.down{fill:#f85149}
}
</style>
<rect class="bg" x="0" y="0" width="880" height="487" rx="6"/>
<text class="title" x="16" y="28">REST response time, median (p50)</text>
<text class="sub" x="16" y="48">ms · log scale · ▲ better ▼ worse than the baseline · interim numbers</text>
<rect class="ours better" x="16" y="62" width="10" height="10" rx="2"/>
<text class="muted" x="30" y="71">kda-indexer, better</text>
<rect class="ours same" x="157" y="62" width="10" height="10" rx="2"/>
<text class="muted" x="171" y="71">kda-indexer, about the same</text>
<rect class="base" x="348" y="62" width="10" height="10" rx="2"/>
<text class="muted" x="362" y="71">baseline</text>
<g class="axis log">
<line class="grid" x1="260.0" y1="78" x2="260.0" y2="447"/>
<text class="tick" x="260.0" y="463" text-anchor="middle">0.1</text>
<line class="grid" x1="355.0" y1="78" x2="355.0" y2="447"/>
<text class="tick" x="355.0" y="463" text-anchor="middle">1</text>
