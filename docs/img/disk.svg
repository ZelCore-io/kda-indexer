<svg xmlns="http://www.w3.org/2000/svg" width="880" height="241" viewBox="0 0 880 241" role="img" aria-labelledby="disk-t disk-d">
<title id="disk-t">Disk used, full mainnet</title>
<desc id="disk-d">Total vs chainweb-data: kda-indexer 140.2 GB, chainweb-data 1,568.6 GB, 11.2× smaller (−91%); Total vs GraphQL indexer (per copy): kda-indexer 140.2 GB, GraphQL indexer 1,870 GB, 13.3× smaller (−93%); Total vs node database (context): kda-indexer 140.2 GB, node 999.7 GB, 7.1× smaller (−86%).</desc>
<style>
svg{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.bg{fill:#ffffff}
.title{fill:#1f2328;font-size:16px;font-weight:600}
.sub,.tick,.muted{fill:#59636e;font-size:11px}
.label{fill:#1f2328;font-size:12px}
.val{fill:#1f2328;font-size:11px}
.grid{stroke:#d8dee4;stroke-width:1}
.ours.better{fill:#1a7f37}
.ours.worse{fill:#cf222e}
.ours.same,.ours.none{fill:#57606a}
.base{fill:#afb8c1}
.up{fill:#1a7f37}
.down{fill:#cf222e}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}
.title,.label,.val{fill:#e6edf3}
.sub,.tick,.muted{fill:#9198a1}
.grid{stroke:#30363d}
.ours.better{fill:#3fb950}
.ours.worse{fill:#f85149}
.ours.same,.ours.none{fill:#9198a1}
.base{fill:#484f58}
.up{fill:#3fb950}
.down{fill:#f85149}
}
</style>
<rect class="bg" x="0" y="0" width="880" height="241" rx="6"/>
<text class="title" x="16" y="28">Disk used, full mainnet</text>
<text class="sub" x="16" y="48">GB · linear scale · ▲ better ▼ worse than the baseline · interim numbers</text>
<rect class="ours better" x="16" y="62" width="10" height="10" rx="2"/>
<text class="muted" x="30" y="71">kda-indexer, better</text>
<rect class="base" x="157" y="62" width="10" height="10" rx="2"/>
<text class="muted" x="171" y="71">baseline</text>
<g class="axis linear">
<line class="grid" x1="260.0" y1="78" x2="260.0" y2="201"/>
<text class="tick" x="260.0" y="217" text-anchor="middle">0</text>
<line class="grid" x1="340.0" y1="78" x2="340.0" y2="201"/>
<text class="tick" x="340.0" y="217" text-anchor="middle">500</text>
<line class="grid" x1="420.0" y1="78" x2="420.0" y2="201"/>
<text class="tick" x="420.0" y="217" text-anchor="middle">1,000</text>
<line class="grid" x1="500.0" y1="78" x2="500.0" y2="201"/>
<text class="tick" x="500.0" y="217" text-anchor="middle">1,500</text>
<line class="grid" x1="580.0" y1="78" x2="580.0" y2="201"/>
<text class="tick" x="580.0" y="217" text-anchor="middle">2,000</text>
</g>
<g class="metric" id="disk-total-vs-cwd">
<text class="label" x="250" y="100" text-anchor="end">Total vs chainweb-data</text>
<rect class="ours better" x="260" y="84" width="22.4" height="12" rx="2"/>
<text class="val" x="288.4" y="94">140.2 GB
 <tspan class="up">▲</tspan>
 11.2× smaller (−91%)
</text>
<rect class="base" x="260" y="99" width="251.0" height="12" rx="2"/>
<text class="muted" x="517.0" y="109">1,568.6 GB · chainweb-data</text>
</g>
<g class="metric" id="disk-total-vs-graphql">
<text class="label" x="250" y="141" text-anchor="end">Total vs GraphQL indexer (per copy)</text>
<rect class="ours better" x="260" y="125" width="22.4" height="12" rx="2"/>
<text class="val" x="288.4" y="135">140.2 GB
 <tspan class="up">▲</tspan>
 13.3× smaller (−93%)
</text>
<rect class="base" x="260" y="140" width="299.2" height="12" rx="2"/>
<text class="muted" x="565.2" y="150">1,870 GB · GraphQL indexer</text>
</g>
<g class="metric" id="disk-total-vs-node">
<text class="label" x="250" y="182" text-anchor="end">Total vs node database (context)</text>
<rect class="ours better" x="260" y="166" width="22.4" height="12" rx="2"/>
<text class="val" x="288.4" y="176">140.2 GB
 <tspan class="up">▲</tspan>
 7.1× smaller (−86%)
</text>
<rect class="base" x="260" y="181" width="160.0" height="12" rx="2"/>
<text class="muted" x="426.0" y="191">999.7 GB · node</text>
