<svg xmlns="http://www.w3.org/2000/svg" width="880" height="487" viewBox="0 0 880 487" role="img" aria-labelledby="latency-rest-p99-t latency-rest-p99-d">
<title id="latency-rest-p99-t">REST response time, tail (p99)</title>
<desc id="latency-rest-p99-d">/txs/account p99: kda-indexer 492 ms, chainweb-data 46,956 ms, 95.4× faster; /txs/events p99: kda-indexer 22 ms, chainweb-data 5,266 ms, 239× faster; /txs/recent p99: kda-indexer 22 ms, chainweb-data 38 ms, 1.7× faster; /txs/search p99: kda-indexer 2,540 ms, chainweb-data 709 ms, 3.6× slower; /stats p99: kda-indexer 2 ms, chainweb-data 66 ms, 33.0× faster; /txs/txs p99: kda-indexer 4 ms, chainweb-data 66 ms, 16.5× faster; /txs/tx p99: kda-indexer 79 ms, chainweb-data 79 ms, about the same; /coins p99: kda-indexer 4 ms, chainweb-data 22 ms, 5.5× faster; /v1/txs p99: kda-indexer 2,540 ms, /v1/txs service 32,609 ms, 12.8× faster.</desc>
<style>
svg{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.bg{fill:#ffffff}
.title{fill:#1f2328;font-size:16px;font-weight:600}
.sub,.tick,.muted{fill:#59636e;font-size:11px}
.label{fill:#1f2328;font-size:12px}
.val{fill:#1f2328;font-size:11px}
.grid{stroke:#d8dee4;stroke-width:1}
.ours.better{fill:#1a7f37}
.ours.worse{fill:#cf222e}
.ours.same,.ours.none{fill:#57606a}
.base{fill:#afb8c1}
.up{fill:#1a7f37}
.down{fill:#cf222e}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}
.title,.label,.val{fill:#e6edf3}
.sub,.tick,.muted{fill:#9198a1}
.grid{stroke:#30363d}
.ours.better{fill:#3fb950}
.ours.worse{fill:#f85149}
.ours.same,.ours.none{fill:#9198a1}
.base{fill:#484f58}
.up{fill:#3fb950}
.down{fill:#f85149}
}
</style>
