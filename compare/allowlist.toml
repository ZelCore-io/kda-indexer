# Accepted differences between side A and side B (spec section 7.3).
# Each entry: id, route (tx, txs, account, events, recent, stats, search, coins, v1txs,
# other or "*"), json_path_glob (JSON pointer; `*` = one segment, `**` = any depth),
# condition (a_extra = only in A, b_extra = only in B, changed, any), optional
# request_contains, reason and owner_note. Everything not matched is a reported diff.

[[entry]]
id = "event-search-window"
route = "events"
json_path_glob = "/**"
condition = "any"
request_contains = "search="
reason = "Event text search only covers a bounded recent window in kda-indexer (decision Q2); chainweb-data scans further back, so older matches differ."
owner_note = "Accepted by the owner. Exact module/name event queries are not covered by this entry. Also covers the minimum search length (kda-indexer 400, chainweb-data 200 on short strings): known G2, compat is to match chainweb-data in the fix round (run 3E ruling R3E-6)."

[[entry]]
id = "orphan-rows-txs"
route = "*"
json_path_glob = "/orphans**"
condition = "any"
reason = "/txs/txs in chainweb-data can return rows from orphaned blocks; kda-indexer keeps canonical blocks only. The harness moves non-canonical rows under /orphans before diffing. Against chainweb-data (no oracle) the rows of blocks other than A's go under /orphans (the node pair checks that A's block is canonical), and chainweb-data's /txs/tx answers 404 for such a request key (seen live: YbvRG1..., chain 2, canonical block QCOhs8... and orphan du_5-bB... at one height); the harness then confirms with one /txs/txs call and reports /orphans."
owner_note = "Builder call (spec section 4.5): orphans are not kept."

[[entry]]
id = "stats-estimate"
route = "stats"
json_path_glob = "/transactionCount~estimate"
condition = "changed"
reason = "chainweb-data returns a Postgres row estimate for transactionCount; counts within 1% are accepted. Larger differences are reported at /transactionCount."
owner_note = "Tolerance from spec section 7.3."

[[entry]]
id = "graphql-page-size"
route = "other"
json_path_glob = "/**"
condition = "any"
request_contains = "graphql"
reason = "GraphQL pages larger than 100 items are capped in kda-indexer (decision Q10)."
owner_note = "Accepted by the owner; only applies once the GraphQL adapter is compared."

# --- From the first live runs (P1, chainweb-data vs node oracle) ---

[[entry]]
id = "genesis-txs-not-indexed"
route = "*"
json_path_glob = "/@genesis"
condition = "b_extra"
reason = "chainweb-data does not serve transactions of genesis blocks (height 0 on chains 0-9, 852054 on chains 10-19); /txs/tx answers 404 and /txs/txs []. The node has them."
owner_note = "Known G1 (run 3E ruling R3E-1): chainweb-data's /txs/txs does list genesis txs (6 per chain, stored at height 0 on all 20 chains) while its /txs/tx answers 404; compat hides them until the fix round makes it match chainweb-data. Against chainweb-data the harness reports compat's 404 there as /@genesis."

[[entry]]
id = "failed-tx-callstack"
route = "*"
json_path_glob = "/result/error/callStack**"
condition = "any"
reason = "For failed txs chainweb-data kept the Pact error as produced at execution time, with a callStack; the node serves the stored output without callStack."
owner_note = "Seen on old failed txs (heights 1.5M-2.0M). The error message and type still compare."

[[entry]]
id = "failed-tx-error-info"
route = "*"
json_path_glob = "/result/error/info"
condition = "changed"
reason = "For failed txs chainweb-data's error info has the source position at execution time (\"<interactive>:0:11937\"); the node serves \"<toplevel>:0\"."
owner_note = "Same txs as failed-tx-callstack."

# --- Harness tolerances reported as visible hits (P3, Task 7) ---

[[entry]]
id = "stats-supply-tolerance"
route = "stats"
json_path_glob = "/coinsInCirculation~tolerance"
condition = "changed"
reason = "Both sides compute the circulating supply at their own tip height and time; values within a relative 1e-6 are accepted. Larger differences are reported at /coinsInCirculation."
owner_note = "Tolerance from the P3 plan (Task 7)."

# --- From the live comparison on the full store (P3, Task 8 / run 3E) ---

[[entry]]
id = "cwd-throttled-page"
route = "*"
json_path_glob = "/~page-cut"
condition = "changed"
reason = "chainweb-data pages hold limit x a throttling factor rows and still carry a Chainweb-Next token, so after the same number of followed pages it has fewer rows. The harness cuts both sides to the heights the shorter side covered completely and reports this visible hit; rows above the cut are compared as usual."
owner_note = "Accepted in the P3 controller rulings (run 3C finding)."

[[entry]]
id = "cwd-txcount-not-canonical"
route = "stats"
json_path_glob = "/transactionCount"
condition = "changed"
reason = "chainweb-data's transactionCount is pg_class.reltuples of a transactions table that is never analyzed, so the value is frozen (200,841,520 on 2026-11-10 while the table holds 233,094,876 rows). Its rows also include txs of orphaned blocks and miss blocks it never fetched. kda-indexer counts canonical user txs exactly (229.9M); per-height windows match chainweb-data where it holds no orphans or gaps."
owner_note = "Accepted (run 3E ruling R3E-4). Without it /stats can never be within 1%: the reference value is stale, not an estimate."

[[entry]]
id = "cwd-page-boundary-dup"
route = "*"
json_path_glob = "/~page-dup"
condition = "changed"
reason = "chainweb-data can start a Chainweb-Next page with the last row of the previous page (seen live on /txs/account with throttled pages: the same transfer, same chain and idx, twice in a row). The harness drops the repeated row (never a transfer to oneself, which chainweb-data lists twice on purpose) and reports this visible hit; kda-indexer pages never repeat a row."
owner_note = "Accepted (run 3E ruling R3E-5): chainweb-data paging bug."

[[entry]]
id = "search-route-p6"
route = "search"
json_path_glob = "/**"
condition = "any"
reason = "/txs/search (pactid and search) is a should route built in P6; until then compat answers 404 and chainweb-data 200."
owner_note = "Out of scope for P3/P4 (plan header); not a must route, so it never gates. Remove in P6."
