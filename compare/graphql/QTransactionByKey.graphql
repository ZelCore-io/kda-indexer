# kdx: oracle
query QTransactionByKey($requestKey: String!, $blockHash: String) { transaction(requestKey: $requestKey, blockHash: $blockHash) { id hash cmd { nonce networkId meta { chainId creationTime gasLimit gasPrice sender ttl } signers { id pubkey scheme clist { name args } } } result { ... on TransactionResult { badResult goodResult gas continuation transactionId height block { id hash height chainId } events(first: 20) { totalCount edges { node { id name qualifiedName orderIndex parameters } } } transfers(first: 20) { totalCount edges { node { id amount creationTime orderIndex senderAccount receiverAccount moduleName chainId blockHash requestKey } } } } } } }
