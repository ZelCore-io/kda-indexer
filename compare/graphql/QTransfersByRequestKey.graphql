# kdx: oracle
query QTransfersByRequestKey($requestKey: String, $blockHash: String, $first: Int, $after: String) { transfers(requestKey: $requestKey, blockHash: $blockHash, first: $first, after: $after) { pageInfo { hasNextPage hasPreviousPage startCursor endCursor } edges { cursor node { id amount creationTime orderIndex senderAccount receiverAccount moduleName chainId blockHash requestKey } } } }
