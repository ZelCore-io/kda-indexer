# Vendored copy of ptr_hash 2.1.3 (MIT, Ragnar Groot Koerkamp), trimmed for kda-indexer:
# the `colored` dependency (MPL-2.0) and its single `.bold()` call in src/util.rs are removed,
# examples and dev-dependencies dropped. See LICENSE-MIT and the repo's THIRD_PARTY_NOTICES.
# Added: PtrHash::from_saved_parts / saved_parts (persisting an index without epserde).
# Changed: the pilot search rng in src/build.rs uses a fixed per-part seed (reproducible builds).
[package]
edition = "2024"
name = "ptr_hash"
version = "2.1.3"
authors = ["Ragnar Groot Koerkamp"]
build = false
include = [
    "src/**/*",
    "readme.md",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A high-throughput minimal perfect hash function"
homepage = "https://curiouscoding.nl/posts/ptrhash"
readme = "readme.md"
keywords = [
    "hashing",
    "minimal",
    "perfect",
    "mphf",
]
categories = [
    "data-structures",
    "science",
]
license = "MIT"
repository = "https://github.com/RagnarGrootKoerkamp/ptrhash"

[features]
default = [
    "rayon",
    "elias-fano",
    "cacheline-ef",
]
elias-fano = ["dep:sucds"]
epserde = [
    "dep:epserde",
    "dep:epserde-derive",
    "cacheline-ef/epserde",
]
hashers = [
    "dep:cityhash-102-rs",
    "dep:fastmurmur3",
    "dep:hashers",
    "dep:highway",
    "dep:metrohash",
    "dep:murmur2",
    "dep:murmur3",
    "dep:wyhash",
]
rayon = [
    "dep:rayon",
    "rdst/multi-threaded",
]
unstable = []

[lib]
name = "ptr_hash"
path = "src/lib.rs"

[dependencies.bitvec]
version = "1.0.1"

[dependencies.cacheline-ef]
version = "2.0.0"
optional = true

[dependencies.cityhash-102-rs]
version = "0.1.0"
optional = true

[dependencies.clap]
version = "4.4.6"
features = ["derive"]
optional = true


[dependencies.epserde]
version = "0.13.0"
optional = true

[dependencies.epserde-derive]
version = "0.13.0"
optional = true

[dependencies.fastmurmur3]
version = "0.2.0"
optional = true

[dependencies.fastrand]
version = "2.0.1"

[dependencies.fxhash]
version = "0.2.1"

[dependencies.gxhash]
version = "3.5.0"
optional = true

[dependencies.hashers]
version = "1.0.1"
optional = true

[dependencies.highway]
version = "1.1.0"
optional = true

[dependencies.itertools]
version = "0.15.0"

[dependencies.log]
version = "0.4.27"

[dependencies.mem_dbg]
version = "0.4.2"

[dependencies.metrohash]
version = "1.0.6"
optional = true

[dependencies.murmur2]
version = "0.1.0"
optional = true

[dependencies.murmur3]
version = "0.5.2"
optional = true

[dependencies.prefetch-index]
version = "0.2.1"

[dependencies.rand]
version = "0.10.2"

[dependencies.rand_chacha]
version = "0.10.0"

[dependencies.rayon]
version = "1.8.0"
optional = true

[dependencies.rdst]
version = "0.20.11"
default-features = false

[dependencies.serde]
version = "1.0.215"
features = ["derive"]
optional = true

[dependencies.sucds]
version = "0.8.0"
optional = true

[dependencies.tempfile]
version = "3.8.1"

[dependencies.wyhash]
version = "0.6.0"
optional = true

[dependencies.xxhash-rust]
version = "0.8.7"
features = [
    "xxh64",
    "xxh3",
]

