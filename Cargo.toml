[workspace]
resolver = "2"
members = [
    "crates/kdx-types",
    "crates/kdx-node",
    "crates/kdx-decode",
    "crates/kda-indexer",
    "crates/kdx-compare",
    "crates/kdx-rk-bench",
    "crates/kdx-hot",
    "crates/kdx-segment",
    "crates/kdx-ingest",
    "crates/kdx-api",
    "crates/kdx-metrics",
]
# Vendored third-party code builds as a path dependency, not as a workspace member (no lints).
exclude = ["vendor/ptr_hash"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "fs", "net"] }
tokio-util = "0.7"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "json", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order"] }
rmp = "0.8"
blake2 = "0.11"
sha2 = "0.11"
zstd = { version = "0.14", features = ["zdict_builder"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
toml = "1"
axum = "0.8"
prometheus-client = "0.25"
utoipa = { version = "5", features = ["preserve_order"] }
# Vendored ptr_hash 2.1.3 (MIT) with the MPL-2.0 `colored` dependency removed (see vendor/ptr_hash).
ptr_hash = { path = "vendor/ptr_hash" }
sucds = "0.8"
roaring = "0.11"
blake3 = "1"
tempfile = "3"
memmap2 = "0.9"
# reth storage crates, pinned to the v2.10.1 release commit. reth-etl is not used: it needs
# reth-db-api (the whole reth/alloy tree); kdx-ingest has its own small ETL collector.
reth-libmdbx = { git = "https://github.com/paradigmxyz/reth", rev = "58ebce14ae63dab040beae301e1578cd0dc55e8a" }
reth-nippy-jar = { git = "https://github.com/paradigmxyz/reth", rev = "58ebce14ae63dab040beae301e1578cd0dc55e8a" }
rand = "0.10"
url = { version = "2", features = ["serde"] }
base64 = "0.22"
hex = "0.4"
bytes = "1"
rayon = "1"
libc = "0.2"
arc-swap = "1"
tower = { version = "0.5", features = ["limit", "timeout", "util"] }
tower-http = { version = "0.6", features = ["cors", "limit"] }

kdx-types = { path = "crates/kdx-types" }
kdx-node = { path = "crates/kdx-node" }
kdx-decode = { path = "crates/kdx-decode" }
kdx-hot = { path = "crates/kdx-hot" }
kdx-segment = { path = "crates/kdx-segment" }
kdx-ingest = { path = "crates/kdx-ingest" }
kdx-api = { path = "crates/kdx-api" }
kdx-metrics = { path = "crates/kdx-metrics" }

# Spec 6.2. target-cpu stays generic so a package built on one node installs on the others.
# If codegen-units = 1 makes the node build exceed ~20 minutes, say so in the run report.
[profile.release]
lto = "thin"
codegen-units = 1
