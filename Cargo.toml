[workspace]
resolver = "2"
members = [
    "crates/kdx-types",
    "crates/kdx-node",
    "crates/kdx-decode",
    "crates/kda-indexer",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "fs"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "json", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order"] }
rmp = "0.8"
blake2 = "0.11"
sha2 = "0.11"
zstd = { version = "0.14", features = ["zdict_builder"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
toml = "1"
axum = "0.8"
prometheus-client = "0.25"
ptr_hash = "2"
rand = "0.10"
url = { version = "2", features = ["serde"] }
base64 = "0.22"
hex = "0.4"
bytes = "1"

kdx-types = { path = "crates/kdx-types" }
kdx-node = { path = "crates/kdx-node" }
kdx-decode = { path = "crates/kdx-decode" }

[profile.release]
lto = "thin"
codegen-units = 4
