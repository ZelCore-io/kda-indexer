# kda-indexer, network mainnet01. Installed by the package as
# /opt/coins/kda-indexer/mainnet01/config/mainnet01.toml
# (a conffile: your edits survive upgrades). Every listener binds loopback; the full list of
# keys with their defaults is in /usr/share/doc/kda-indexer/examples/mainnet01.toml.example.
network = "mainnet01"
data_dir = "/opt/coins/data/kadena/kda-indexer/mainnet01"

[node]
url = "http://127.0.0.1:31351"          # chainweb-node service API on the same host
timeout_ms = 30000

[ingest]
finality_depth = 1000
batch_size = 50
node_concurrency = 8
max_rps = 200

[backfill]
ranges_in_flight = 2
range_heights = 100000
step_heights = 10000
min_free_gb = 60

[tail]
commit_ms = 1000
commit_blocks = 40
cut_poll_secs = 10

[api]
native = "127.0.0.1:31361"     # internal only: loopback or a private address
compat = "127.0.0.1:31362"
graphql = "127.0.0.1:31363"    # GraphQL; loopback until the G4 host config
admin = "127.0.0.1:31369"      # /healthz /readyz /status /metrics; loopback or private only
trusted_proxies = []           # proxy IPs or CIDRs whose X-Forwarded-For is trusted
rate_per_ip = 20

# Optional: also write the metrics for node_exporter's textfile collector (see
# /usr/share/doc/kda-indexer/install.md; the directory must be writable by kda-indexer).
# [metrics]
# textfile = "/var/lib/node_exporter/textfile_collector/kda_indexer.prom"


[graphql]
# GraphQL limits (docs/graphql.md); the listener address is api.graphql. All optional.
# default_page = 20          # page size when first/last are omitted
# max_page = 100             # larger first/last are clamped to this
# max_depth = 10
# max_complexity = 2000
# introspection = true
# introspection_depth = 14   # introspection is exempt from max_depth, capped here
# max_batch = 10             # operations per batched request (N rate tokens)
# max_query_bytes = 32768
# max_variables_bytes = 65536
# ws_subs_per_conn = 20
# ws_subs_max = 2000
# ws_conns_per_ip = 10
# ws_init_secs = 10
# ws_idle_secs = 600
# ws_tx_wait_secs = 3600
# feed_poll_ms = 1000
# network_host = ""          # networkInfo.networkHost: a public name, never the node URL

[log]
format = "text"    # or "json"
level = "info"
